services:
  - type: web
    name: clinical-pharmacy-app
    runtime: node
    region: oregon
    plan: free
    # db:init runs the whole of schema.sql. Keep it in the build, not the start command:
    # a free instance restarts whenever it wakes, and a migration that fails there takes
    # the app down with it. Here a failure fails the deploy and the running version stays
    # up. Consequence: a schema.sql change needs a new deploy, not just a restart.
    buildCommand: npm ci --include=dev && npm run build && npm run db:init
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set in the Render dashboard to the external Postgres (Neon) connection string.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_SIZE
        value: "15"
      # The free plan has 512 MB. Without a cap Node lets the heap grow into it and the instance is
      # killed (measured: one reports call grew RSS to ~680 MB locally; capped at 160 MB the same
      # run peaked at ~365 MB). 300 leaves room for buffers and the runtime itself.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=300"
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      # Web push (server/push.js). Generate once with `npx web-push generate-vapid-keys` and set all
      # three in the dashboard. Never change the keys afterwards: every device's subscription is
      # tied to the public key, so a new pair silently ends them all. Unset = notifications off.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Error alerts (server/errors.js): from @BotFather and the chat id. Without both, errors are
      # still saved and listed in the app; only the Telegram message is skipped.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
