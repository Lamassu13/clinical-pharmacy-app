services:
  - type: web
    name: clinical-pharmacy-app
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:init && npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set in the Render dashboard to the external Postgres (Neon) connection string.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_SIZE
        value: "15"
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
