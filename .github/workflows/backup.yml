name: Backup database

# Off-site backup (on the 1st and 16th, ~every 15 days: each dump is read over the wire from Neon, which bills transfer) of the production Postgres database to a private Backblaze B2
# bucket. This repo is public, so a dump must never land in the repo or in a workflow
# artifact — both are publicly downloadable on a public repo. B2 is the only destination
# here, reached with an application key scoped to just the one backup bucket.
#
# Needs three repository secrets (Settings -> Secrets and variables -> Actions):
#   DATABASE_URL        same connection string the Render app uses
#   B2_KEY_ID            Backblaze application key ID, scoped to the backup bucket only
#   B2_APPLICATION_KEY   the matching application key
#   BACKUP_PASSPHRASE    the passphrase each dump is encrypted with (keep a copy outside GitHub)
# See README.md "Backups" for setup and restore instructions.

on:
  schedule:
    - cron: '0 2 1,16 * *'
  workflow_dispatch: {}

permissions:
  contents: read

env:
  B2_BUCKET: clinical-pharmacy-db-backup

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install a current pg_dump (PGDG apt repo)
        # pg_dump must be the same version as the database server, or newer — never older.
        # Neon supports Postgres 14 through 18, and a project can be on any of them, so this
        # installs 18 (the newest) rather than pinning to whatever this project happens to
        # run today: a newer pg_dump can always dump an older server, not the reverse.
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18

      - name: Install the b2 CLI
        run: pipx install b2==4.7.1

      - name: Dump the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CPA_BACKUP_DIR: ${{ runner.temp }}/backups
          PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
        run: bash scripts/backup-db.sh

      # The dump holds patient names and every account's details, so only ciphertext leaves the
      # runner: AES-256 with the BACKUP_PASSPHRASE secret. No secret means no upload — never a
      # plaintext fallback. The passphrase goes in on stdin, not the command line.
      - name: Encrypt the dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_PASSPHRASE:-}" ]; then
            echo "The BACKUP_PASSPHRASE secret is not set; refusing to upload an unencrypted dump." >&2
            exit 1
          fi
          dump_file="$(ls -t "${{ runner.temp }}/backups"/*.dump | head -n1)"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --compress-algo none --output "$dump_file.gpg" "$dump_file"
          rm -f "$dump_file"

      - name: Upload to Backblaze B2
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set -euo pipefail
          b2 account authorize
          encrypted_file="$(ls -t "${{ runner.temp }}/backups"/*.dump.gpg | head -n1)"
          b2 file upload "$B2_BUCKET" "$encrypted_file" "backups/cpa-$(date -u +%Y%m%d).dump.gpg"
